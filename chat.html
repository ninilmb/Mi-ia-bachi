<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduIA - Cozy Chat</title>
    <style>
        :root {
            --bg-principal: #fff9e6; --rosa-pastel: #ffe3e8; --rosa-fuerte: #ff8fa3;
            --amarillo-pastel: #fff0b3; --texto-cozy: #4a3e4d; --blanco: #ffffff;
            --sombra-soft: rgba(255, 143, 163, 0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', system-ui, sans-serif; }
        body { background: var(--bg-principal); color: var(--texto-cozy); height: 100vh; display: flex; flex-direction: column; padding: 15px; }
        header { background: var(--blanco); padding: 15px; border-radius: 18px; box-shadow: 0 6px 15px var(--sombra-soft); display: flex; justify-content: space-between; align-items: center; border: 2px solid var(--rosa-pastel); }
        .btn-volver { background: var(--rosa-pastel); color: var(--rosa-fuerte); border: none; padding: 8px 16px; border-radius: 12px; font-weight: 700; text-decoration: none; font-size: 0.9rem; }
        header h2 { font-size: 1.2rem; font-weight: 800; }
        .chat-container { flex: 1; max-width: 800px; width: 100%; margin: 15px auto; background: var(--blanco); border-radius: 25px; display: flex; flex-direction: column; overflow: hidden; border: 2px solid var(--rosa-pastel); box-shadow: 0 10px 25px var(--sombra-soft); }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 12px 18px; border-radius: 18px; font-size: 0.95rem; line-height: 1.5; white-space: pre-line; font-weight: 600; }
        .message.bot { background: var(--bg-principal); color: var(--texto-cozy); align-self: flex-start; border-top-left-radius: 4px; }
        .message.user { background: var(--rosa-fuerte); color: var(--blanco); align-self: flex-end; border-top-right-radius: 4px; }
        .img-preview-chat { max-width: 180px; border-radius: 12px; margin-top: 5px; display: block; border: 2px solid var(--rosa-pastel); }
        .chat-input-area { padding: 15px; background: var(--bg-principal); display: flex; align-items: center; gap: 10px; border-top: 2px solid var(--rosa-pastel); }
        .btn-camara { background: var(--rosa-pastel); color: var(--rosa-fuerte); width: 45px; height: 45px; border-radius: 14px; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .chat-input-area input[type="text"] { flex: 1; padding: 14px; border: 2px solid var(--rosa-pastel); border-radius: 14px; outline: none; background: var(--blanco); color: var(--texto-cozy); font-weight: 600; }
        .btn-enviar { background: var(--rosa-fuerte); color: var(--blanco); border: none; padding: 14px 22px; border-radius: 14px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="btn-volver">← Volver</a>
        <h2 id="titulo-asignatura">Tutor Cozy</h2>
        <div style="width: 70px;"></div>
    </header>
    <div class="chat-container">
        <div class="chat-messages" id="chatBox"></div>
        <div class="chat-input-area">
            <label class="btn-camara" for="fileInput">📸</label>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="procesarFoto(event)">
            <input type="text" id="userInput" placeholder="Escribe aquí tu duda o sube una foto..." onkeypress="detectarEnter(event)">
            <button class="btn-enviar" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>
