<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduIA - Chat</title>
    <style>
        :root {
            --bg: #f0f4f8; --text: #1e293b; --sub: #64748b;
            --blue: #3b82f6; --pastel: #dbeafe; --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--white); padding: 15px; box-shadow: 0 4px 12px rgba(148,163,184,0.15); display: flex; justify-content: space-between; align-items: center; }
        .btn-volver { background: var(--pastel); color: var(--blue); border: none; padding: 8px 16px; border-radius: 10px; font-weight: 600; text-decoration: none; font-size: 0.9rem; }
        .chat-container { flex: 1; max-width: 800px; width: 100%; margin: 15px auto; background: var(--white); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(219,234,254,0.5); }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 12px 18px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; white-space: pre-line; }
        .message.bot { background: var(--bg); color: var(--text); align-self: flex-start; border-top-left-radius: 4px; }
        .message.user { background: var(--blue); color: var(--white); align-self: flex-end; border-top-right-radius: 4px; }
        .img-preview-chat { max-width: 180px; border-radius: 10px; margin-top: 5px; display: block; }
        .chat-input-area { padding: 15px; background: var(--bg); display: flex; align-items: center; gap: 10px; }
        .btn-camara { background: var(--pastel); color: var(--blue); width: 45px; height: 45px; border-radius: 12px; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .chat-input-area input[type="text"] { flex: 1; padding: 14px; border: 1px solid rgba(148,163,184,0.3); border-radius: 12px; outline: none; background: var(--white); }
        .btn-enviar { background: var(--text); color: var(--white); border: none; padding: 14px 22px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="btn-volver">← Volver</a>
        <h2 id="titulo-asignatura">Tutor</h2>
        <div style="width: 70px;"></div>
    </header>
    <div class="chat-container">
        <div class="chat-messages" id="chatBox"></div>
        <div class="chat-input-area">
            <label class="btn-camara" for="fileInput">📸</label>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="procesarFoto(event)">
            <input type="text" id="userInput" placeholder="Pregúntame o sube una foto..." onkeypress="detectarEnter(event)">
            <button class="btn-enviar" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>
    <script>
        const nombres = { 'mates': '📊 Matemáticas CCSS', 'quimica': '🧪 Química', 'biologia': '🧬 Biología', 'psicologia': '🧠 Psicología', 'castellano': '📚 Castellano', 'catalan': '📖 Catalán', 'ingles': '🇬🇧 Inglés', 'historia-espana': '🏰 Historia', 'filosofia': '🏛️ Filosofía' };
        const saludos = [
            "¡Hola! Qué alegría tenerte por aquí. Vamos a darle caña al estudio relajados. ¿Qué vemos hoy? ✨",
            "¡Buenas! Menudo mérito tienes hincando los codos. Cuéntame tu duda y la resolvemos sin dramas. 🤝",
            "¡Hola, hola! Ponte cómodo/a en tu zona de estudio. ¿Qué te está costando más? 🚀"
        ];
        const respuestasIA = {
            'mates': {
                'derivada': "¡Las derivadas son clave! Indican la rapidez con la que cambia una función en un punto concreto.\n\n📌 *Regla básica:* Si tienes x², su derivada es 2x. ¡Solo bajas el exponente multiplicando!",
                'matriz': "Una matriz es una caja organizada con filas y columnas llena de números. Piensa en ella como una tabla de datos inteligente.\n\n📌 *Para Selectividad:* Te pedirán calcular la Inversa (A⁻¹) o usar el Método de Cramer. ¡Es muy mecánico!",
                'probabilidad': "Mide las opciones de que algo ocurra.\n\n📌 *Truco:* Aplica la Regla de Laplace (Casos favorables / Casos posibles). Si te cuesta ver el problema, haz un diagrama de árbol.",
                'estadistica': "Se centra en intervalos de confianza.\n\n📌 *Secreto:* Usa la fórmula de Zα/2 para el nivel de confianza y opera con cuidado en la calculadora.",
                'limite': "Un límite es ver a qué valor se acerca una función. Si te da una indeterminación como 0/0, ¡aplica la Regla de L'Hôpital derivando arriba y abajo!",
                'default': "¡Gran duda matemática! Domino derivadas, matrices, límites, probabilidad y estadística. ¿Cuál de estos repasamos de forma amigable hoy?"
            },
            'quimica': {
                'atomo': 'El átomo es la pieza fundamental de la materia. Tiene un núcleo positivo en el centro y electrones orbitando alrededor.',
                'enlace': 'Un enlace es la unión entre átomos para conseguir estabilidad química.',
                'default': "¡Buena duda de Química! Puedes preguntarme sobre el 'atomo' o los 'enlaces' químicos por ahora."
            }
        };

        const activeAsig = localStorage.getItem('asignaturaActiva') || 'mates';
        document.getElementById('titulo-asignatura').textContent = nombres[activeAsig] || 'Tutor de IA';
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        function globo(txt, emisor) {
            const g = document.createElement('div'); g.classList.add('message', emisor); g.textContent = txt;
            chatBox.appendChild(g); chatBox.scrollTop = chatBox.scrollHeight;
        }

        function procesarFoto(e) {
            const file = e.target.files[0]; if (!file) return;
            const r = new FileReader();
            r.onload = function(evt) {
                const gUser = document.createElement('div'); gUser.classList.add('message', 'user');
                gUser.innerHTML = `📸 Imagen enviada:<br><img src="${evt.target.result}" class="img-preview-chat">`;
                chatBox.appendChild(gUser); chatBox.scrollTop = chatBox.scrollHeight;
                setTimeout(() => { globo("🤖 [Análisis Visual] ¡Veo tu ejercicio! Sigue estos pasos:\n1. Identifica los datos del enunciado.\n2. Aplica la fórmula principal paso a paso.\n3. Ojo con los signos al despejar.\n\n¿Quieres escribirme la ecuación para que la revisemos juntos?", "bot"); }, 1000);
            };
            r.readAsDataURL(file);
        }

        function enviarMensaje() {
            const txt = userInput.value.trim(); if (txt === '') return;
            globo(txt, 'user'); userInput.value = '';
            setTimeout(() => {
                const clean = txt.toLowerCase(); let res = '';
                const greets = ['hola', 'buenas', 'que tal', 'cómo estás', 'como estas'];
                if (greets.some(g => clean.startsWith(g) || clean === g)) {
                    res = saludos[Math.floor(Math.random() * saludos.length)];
                } else {
                    const base = respuestasIA[activeAsig] || { 'default': '¡Qué buen interés! Estoy ampliando mis apuntes para esta materia.' };
                    let found = false;
                    for (let c in base) { if (clean.includes(c) && c !== 'default') { res = base[c]; found = true; break; } }
                    if (!found) res = base['default'];
                }
                globo(res, 'bot');
            }, 500);
        }
        function detectarEnter(e) { if (e.key === 'Enter') enviarMensaje(); }
        globo('✨ ¡Hola! Ya estamos en tu zona de estudio. Soy tu tutor personal. Dime qué concepto se te resiste o pulsa 📸 para mandarme una foto de tu ejercicio. ¡Tú puedes!', 'bot');
    </script>
</body>
</html>
