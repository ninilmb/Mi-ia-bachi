<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduIA - Mi Calendario de Estudio</title>
    <style>
        :root {
            --bg-principal: #f0f4f8;
            --azul-oscuro: #1e293b;
            --azul-aesthetic: #64748b;
            --azul-electrico: #3b82f6;
            --azul-pastel: #dbeafe;
            --blanco: #ffffff;
            --sombra: rgba(148, 163, 184, 0.15);
            --coral: #ff7a7a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-principal); color: var(--azul-oscuro); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; }
        
        header {
            background-color: var(--blanco); padding: 15px 20px; box-shadow: 0 4px 12px var(--sombra);
            display: flex; justify-content: space-between; align-items: center; border-radius: 15px;
            max-width: 900px; width: 100%; margin: 0 auto 20px auto;
        }

        .btn-volver {
            background-color: var(--azul-pastel); color: var(--azul-electrico); border: none;
            padding: 8px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.9rem;
        }

        .container { max-width: 900px; width: 100%; margin: 0 auto; display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        
        .card { background: var(--blanco); border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px var(--sombra); border: 1px solid rgba(219,234,254,0.5); }
        
        /* DISEÑO DEL CALENDARIO */
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .cal-header h3 { font-size: 1.3rem; }
        .btn-cal { background: var(--azul-pastel); color: var(--azul-electrico); border: none; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 600; color: var(--azul-aesthetic); margin-bottom: 10px; font-size: 0.9rem; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        
        .day { background: var(--bg-principal); aspect-ratio: 1; border-radius: 10px; padding: 5px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: all 0.2s; position: relative; }
        .day:hover { background: var(--azul-pastel); }
        .day.empty { background: transparent; cursor: default; }
        .day.today { border: 2px solid var(--azul-electrico); }
        .day-num { font-weight: 600; font-size: 0.9rem; }
        
        /* Indicador de evento en el cuadradito */
        .event-dot { width: 6px; height: 6px; background-color: var(--coral); border-radius: 50%; align-self: center; margin-bottom: 5px; }

        /* GESTOR DE TAREAS LATERAL */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .input-box input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(148, 163, 184, 0.3); margin-bottom: 10px; outline: none; background: var(--bg-principal); }
        .btn-add { background: var(--azul-electrico); color: var(--white); border: none; width: 100%; padding: 10px; border-radius: 8px; font-weight: 600; color: white; cursor: pointer; }
        
        .events-list { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; }
        .event-item { background: var(--bg-principal); padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; border-left: 4px solid var(--coral); }
        .btn-del { background: none; border: none; color: red; cursor: pointer; font-weight: bold; }

        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="btn-volver">← Volver</a>
        <h2>📅 Mi Agenda de Bachillerato</h2>
        <div style="width: 70px;"></div>
    </header>

    <div class="container">
        <!-- CALENDARIO -->
        <div class="card">
            <div class="cal-header">
                <button class="btn-cal" onclick="cambiarMes(-1)">◀</button>
                <h3 id="mesAnioTitulo">Mes Año</h3>
                <button class="btn-cal" onclick="cambiarMes(1)">▶</button>
            </div>
            <div class="weekdays">
                <div>Lu</div><div>Ma</div><div>Mi</div><div>Ju</div><div>Vi</div><div>Sá</div><div>Do</div>
            </div>
            <div class="days-grid" id="daysContainer"></div>
        </div>

        <!-- FORMULARIO LATERAL -->
        <div class="sidebar">
            <div class="card input-box">
                <h4 id="fechaSeleccionadaTexto">Selecciona un día</h4>
                <p style="font-size:0.85rem; color:var(--azul-aesthetic); margin-bottom:10px;">Haz clic en cualquier cuadrado para añadir un evento.</p>
                <input type="text" id="eventInput" placeholder="Ej: Examen de Mates, Entrega Bio..." disabled>
                <button class="btn-add" id="btnAdd" onclick="agregarEvento()" disabled>Añadir Fecha ✨</button>
            </div>

            <div class="card">
                <h4>Eventos de este mes</h4>
                <div class="events-list" id="listaEventosMes"></div>
            </div>
        </div>
    </div>

    <script>
        const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        
        let fechaActual = new Date();
        let diaSeleccionadoKey = null;
        
        // Cargar eventos guardados
        let eventos = JSON.parse(localStorage.getItem('misEventosCalendario')) || {};

        function renderizarCalendario() {
            const anio = fechaActual.getFullYear();
            const mes = fechaActual.getMonth();
            
            document.getElementById('mesAnioTitulo').textContent = `${meses[mes]} de ${anio}`;
            
            // Primer día del mes (ajustado para que lunes sea 0)
            let primerDiaIndex = new Date(anio, mes, 1).getDay() - 1;
            if (primerDiaIndex === -1) primerDiaIndex = 6; // Si es domingo
            
            // Total días del mes
            const totalDias = new Date(anio, mes + 1, 0).getDate();
            
            const container = document.getElementById('daysContainer');
            container.innerHTML = '';
            
            // Cuadrados vacíos para el desfase del inicio de mes
            for (let i = 0; i < primerDiaIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.classList.add('day', 'empty');
                container.appendChild(emptyDiv);
            }
            
            // Crear cuadraditos para cada día
            const hoy = new Date();
            for (let d = 1; d <= totalDias; d++) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('day');
                
                // Formato clave única para cada fecha (ej: "2026-08-27")
                const fechaKey = `${anio}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                
                dayDiv.innerHTML = `<span class="day-num">${d}</span>`;
                
                // Marcar si es el día de hoy
                if (d === hoy.getDate() && mes === hoy.getMonth() && anio === hoy.getFullYear()) {
                    dayDiv.classList.add('today');
                }
                
                // Poner un puntito si tiene eventos guardados
                if (eventos[fechaKey] && eventos[fechaKey].length > 0) {
                    const dot = document.createElement('div');
                    dot.classList.add('event-dot');
                    dayDiv.appendChild(dot);
                }
                
                dayDiv.onclick = () => seleccionarDia(fechaKey, d);
                container.appendChild(dayDiv);
            }
            
            actualizarListaEventosMes();
        }

        function cambiarMes(direccion) {
            fechaActual.setMonth(fechaActual.getMonth() + direccion);
            renderizarCalendario();
            desseleccionar();
        }

        function seleccionarDia(key, numDia) {
            diaSeleccionadoKey = key;
            document.getElementById('fechaSeleccionadaTexto').textContent = `Día ${numDia} de ${meses[fechaActual.getMonth()]}`;
            document.getElementById('eventInput').disabled = false;
            document.getElementById('btnAdd').disabled = false;
            document.getElementById('eventInput').focus();
        }

        function desseleccionar() {
            diaSeleccionadoKey = null;
            document.getElementById('fechaSeleccionadaTexto').textContent = `Selecciona un día`;
            document.getElementById('eventInput').value = '';
            document.getElementById('eventInput').disabled = true;
            document.getElementById('btnAdd').disabled = true;
        }

        function agregarEvento() {
            const texto = document.getElementById('eventInput').value.trim();
            if (!texto || !diaSeleccionadoKey) return;
            
            if (!eventos[diaSeleccionadoKey]) eventos[diaSeleccionadoKey] = [];
            eventos[diaSeleccionadoKey].push(texto);
            
            localStorage.setItem('misEventosCalendario', JSON.stringify(eventos));
            document.getElementById('eventInput').value = '';
            
            renderizarCalendario();
        }

        function borrarEvento(key, index) {
            eventos[key].splice(index, 1);
            if (eventos[key].length === 0) delete eventos[key];
