<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduIA - Chat Tutor</title>
    <style>
        :root {
            --bg-principal: #f0f4f8;
            --azul-oscuro: #1e293b;
            --azul-aesthetic: #64748b;
            --azul-electrico: #3b82f6;
            --azul-pastel: #dbeafe;
            --blanco: #ffffff;
            --sombra: rgba(148, 163, 184, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--azul-oscuro);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--blanco);
            padding: 15px 20px;
            box-shadow: 0 4px 12px var(--sombra);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-volver {
            background-color: var(--azul-pastel);
            color: var(--azul-electrico);
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }

        header h2 {
            font-size: 1.2rem;
            color: var(--azul-oscuro);
        }

        .chat-container {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
            background-color: var(--blanco);
            border-radius: 20px;
            box-shadow: 0 10px 25px var(--sombra);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(219, 234, 254, 0.5);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .message.bot {
            background-color: var(--bg-principal);
            color: var(--azul-oscuro);
            align-self: flex-start;
            border-top-left-radius: 4px;
        }

        .message.user {
            background-color: var(--azul-electrico);
            color: var(--blanco);
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        .chat-input-area {
            padding: 15px 20px;
            background-color: var(--bg-principal);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(219, 234, 254, 0.7);
        }

        .chat-input-area input {
            flex: 1;
            padding: 14px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            background-color: var(--blanco);
        }

        .chat-input-area button {
            background-color: var(--azul-oscuro);
            color: var(--blanco);
            border: none;
            padding: 0 22px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .chat-input-area button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="btn-volver">← Volver</a>
        <h2 id="titulo-asignatura">Cargando Tutor...</h2>
        <div style="width: 70px;"></div>
    </header>

    <div class="chat-container">
        <div class="chat-messages" id="chatBox"></div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Pregúntame una duda sobre esta materia..." onkeypress="detectarEnter(event)">
            <button onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script>
        const nombresAsignaturas = {
            'mates': '📊 Matemáticas CCSS',
            'quimica': '🧪 Química',
            'biologia': '🧬 Biología',
            'psicologia': '🧠 Psicología',
            'castellano': '📚 Castellano y Lit.',
            'catalan': '📖 Catalán y Lit.',
            'ingles': '🇬🇧 Inglés',
            'historia-espana': '🏰 Historia de España',
            'filosofia': '🏛️ Filosofía'
        };

        // SALUDOS INTERACTIVOS GENERALES
        const respuestasSaludos = [
            "¡Hola! Qué alegría tenerte por aquí en tu zona de estudio. Con calma y sin agobios, ¿en qué concepto te puedo echar una mano hoy? ✨",
            "¡Buenas! Menudo mérito tienes estudiando Bachillerato hoy. Cuéntame, ¿qué es lo que más se te está atragantando de este tema? Vamos a solucionarlo juntos. 🤝",
            "¡Hola, hola! Ponte cómodo/a. Estoy aquí para hacértelo todo más fácil y ameno. ¿Qué duda ronda por tu cabeza en esta asignatura? 🚀",
            "¡Hola! Recuerda que no hay preguntas tontas. Respira hondo y dime qué parte necesitas que te explique de forma súper sencilla. 🧠"
        ];

        // BASE DE CONOCIMIENTO (SIMULADOR DE IA LOCAL)
        const respuestasIA = {
            'mates': {
                'derivada': 'Una derivada es simplemente la velocidad a la que cambia algo. Imagina que mides la rapidez con la que se llena una piscina en un segundo exacto. ¡No le tengas miedo, son solo tasas de cambio!',
                'matriz': 'Una matriz es como una tabla de Excel. Una caja súper ordenada con filas y columnas llena de números que nos sirve para resolver sistemas de ecuaciones súper rápido.',
                'default': "¡Es una gran pregunta de Mates! Aunque todavía estoy ampliando mi base de datos para resolver ese problema exacto con fórmulas, recuerda que lo importante es ir paso a paso. ¿Quieres que repasemos qué es una 'derivada' o una 'matriz' para calentar motores?"
            },
            'quimica': {
                'atomo': 'El átomo es la pieza de LEGO fundamental de la que está hecho todo el universo. Tiene un núcleo positivo en el centro y electrones cargados de energía girando a toda pastilla alrededor.',
                'enlace': 'Un enlace químico es como un apretón de manos muy fuerte o un abrazo entre dos átomos. Se unen para compartir energía y estar mucho más estables y tranquilos juntos.',
                'default': "¡Oye, qué buena duda de Química! Todavía estoy cargando los apuntes exactos para esa fórmula en mi sistema, pero no te agobies. ¿Te apetece que te explique de forma sencilla cómo funciona un 'atomo' o qué tipos de 'enlace' existen?"
            },
            'filosofia': {
                'platon': 'Platón decía que vivimos en un mundo de sombras (lo que vemos y tocamos, que cambia), pero que la verdadera realidad son las Ideas perfectas, que son eternas y están en un mundo intangible. ¡Como si nuestro mundo fuera solo el reflejo de un proyector!',
                'kant': 'Kant inventó el \"imperativo categórico\". Básicamente significa: antes de actuar, piensa si te gustaría que todo el mundo hiciera lo mismo que tú. Si la respuesta es sí, vas por buen camino moral.',
                'default': "¡Qué gran dilema filosófico acabas de plantear! Me encanta cómo piensas. Aún estoy puliendo mis textos para responder a ese autor en concreto, pero si quieres podemos charlar un rato sobre 'Platon' o 'Kant' para inspirarte."
            }
        };

        const asignaturaActiva = localStorage.getItem('asignaturaActiva') || 'mates';
        document.getElementById('titulo-asignatura').textContent = nombresAsignaturas[asignaturaActiva] || 'Tutor de IA';

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        function bienvenida() {
            agregarGlobo('✨ ¡Hola! Ya estamos en tu zona de estudio y tranquilidad. Soy tu tutor personal. Dime qué concepto se te resiste y te lo explicaré de forma breve, humana y súper fácil. ¡Tú puedes con esto!', 'bot');
        }

        function agregarGlobo(texto, emisor) {
            const globo = document.createElement('div');
            globo.classList.add('message', emisor);
            globo.textContent = texto;
            chatBox.appendChild(globo);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function enviarMensaje() {
            const textoUsuario = userInput.value.trim();
            if (textoUsuario === '') return;

            agregarGlobo(textoUsuario, 'user');
            userInput.value = '';

            // Pequeño retardo para simular que la IA está escribiendo de forma natural
            setTimeout(() => {
                const textoLimpio = textoUsuario.toLowerCase();
                let respuesta = '';

                // 1. REGLA DE EMPATÍA: ¿El usuario está saludando?
                const palabrasSaludo = ['hola', 'buenas', 'que tal', 'cómo estás', 'como estas', 'hello', 'buenos dias', 'buenas tardes'];
                const esSaludo = palabrasSaludo.some(saludo => textoLimpio.startsWith(saludo) || textoLimpio === saludo);

                if (esSaludo) {
                    // Elige un saludo amigable aleatorio de la lista
                    const indiceAleatorio = Math.floor(Math.random() * respuestasSaludos.length);
                    respuesta = respuestasSaludos[indiceAleatorio];
                } else {
                    // 2. Si no es un saludo, busca palabras clave de la asignatura
                    const baseMateria = respuestasIA[asignaturaActiva] || {
