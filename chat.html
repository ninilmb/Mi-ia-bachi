<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduIA - Chat Inteligente de Bachillerato</title>
    <style>
        :root {
            --bg-principal: #f0f4f8;
            --azul-oscuro: #1e293b;
            --azul-aesthetic: #64748b;
            --azul-electrico: #3b82f6;
            --azul-pastel: #dbeafe;
            --blanco: #ffffff;
            --sombra: rgba(148, 163, 184, 0.15);
            --verde-aesthetic: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--azul-oscuro);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--blanco);
            padding: 15px 20px;
            box-shadow: 0 4px 12px var(--sombra);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-volver {
            background-color: var(--azul-pastel);
            color: var(--azul-electrico);
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }

        header h2 { font-size: 1.2rem; color: var(--azul-oscuro); }

        .chat-container {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
            background-color: var(--blanco);
            border-radius: 20px;
            box-shadow: 0 10px 25px var(--sombra);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(219, 234, 254, 0.5);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-line;
        }

        .message.bot {
            background-color: var(--bg-principal);
            color: var(--azul-oscuro);
            align-self: flex-start;
            border-top-left-radius: 4px;
        }

        .message.user {
            background-color: var(--azul-electrico);
            color: var(--blanco);
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        /* Vista previa de la foto subida en el chat */
        .img-preview-chat {
            max-width: 200px;
            border-radius: 10px;
            margin-top: 5px;
            display: block;
        }

        .chat-input-area {
            padding: 15px 20px;
            background-color: var(--bg-principal);
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid rgba(219, 234, 254, 0.7);
        }

        /* Botón de la cámara ocultando el input real */
        .btn-camara {
            background-color: var(--azul-pastel);
            color: var(--azul-electrico);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-camara:hover {
            background-color: var(--azul-electrico);
            color: var(--blanco);
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 14px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            background-color: var(--blanco);
        }

        .chat-input-area button.btn-enviar {
            background-color: var(--azul-oscuro);
            color: var(--blanco);
            border: none;
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="btn-volver">← Volver</a>
        <h2 id="titulo-asignatura">Cargando Tutor...</h2>
        <div style="width: 70px;"></div>
    </header>

    <div class="chat-container">
        <div class="chat-messages" id="chatBox"></div>
        <div class="chat-input-area">
            <!-- Botón de Cámara que activa el lector oculto -->
            <label class="btn-camara" for="fileInput">📸</label>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="procesarFoto(event)">
            
            <input type="text" id="userInput" placeholder="Pregúntame una duda o sube una foto..." onkeypress="detectarEnter(event)">
            <button class="btn-enviar" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script>
        const nombresAsignaturas = {
            'mates': '📊 Matemáticas CCSS', 'quimica': '🧪 Química', 'biologia': '🧬 Biología',
            'psicologia': '🧠 Psicología', 'castellano': '📚 Castellano y Lit.', 'catalan': '📖 Catalán y Lit.',
            'ingles': '🇬🇧 Inglés', 'historia-espana': '🏰 Historia de España', 'filosofia': '🏛️ Filosofía'
        };

        const respuestasSaludos = [
            "¡Hola! Qué alegría tenerte por aquí. Vamos a darle caña al estudio de forma relajada. ¿Qué concepto vemos hoy? ✨",
            "¡Buenas! Menudo mérito tienes hincando los codos. Cuéntame tu duda y la resolvemos sin dramas. 🤝",
            "¡Hola, hola! Ponte cómodo/a en tu zona de estudio. ¿Qué ejercicio o teoría te está costando más? 🚀"
        ];

        // BASE DE DATOS MATEMÁTICA Y GENERAL EXPANDIDA
        const respuestasIA = {
            'mates': {
                'derivada': "¡Las derivadas son preciosas! Imagina que vas en coche: el velocímetro te dice tu velocidad en un instante exacto. Eso es la derivada: la rapidez con la que cambia una función en un punto concreto.\n\n📌 *Regla básica:* Si tienes x², su derivada es 2x. ¡Solo bajas el exponente multiplicando!",
                'matriz': "Una matriz es una caja organizada con filas y columnas llena de números. Piensa en ella como una tabla de datos inteligente.\n\n📌 *Para Selectividad:* Te pedirán calcular la Inversa (A⁻¹) o usar el Método de Cramer para sistemas de ecuaciones. ¡Es mecánico, si practicas el orden lo tienes asegurado!",
                'probabilidad': "La probabilidad mide las opciones de que algo ocurra.\n\n📌 *Truco de Bachillerato:* Grábate a fuego la Regla de Laplace: Casos favorables partidos por Casos posibles. Si es un problema complejo, haz un diagrama de árbol, ¡te salvará la vida!",
                'estadistica': "En ciencias sociales se centra en intervalos de confianza y muestreo.\n\n📌 *Secreto:* Siempre te pedirán la media muestral o estimar una proporción. Usa la fórmula de Zα/2 (el nivel de confianza) y el resto es usar la calculadora con cuidado.",
                'limite': "Un límite es ver a qué valor se acerca una función cuando la 'x' se aproxima a un número. Si te da una indeterminación como 0/0, ¡aplica la Regla de L'Hôpital derivando arriba y abajo!",
                'default': "¡Qué buena pregunta matemática! Como tutor local, domino conceptos clave de Bachillerato como derivadas, matrices, límites, probabilidad y estadística. ¿Cuál de estos te apetece que desengranemos de manera súper amigable hoy?"
            },
            'quimica': {
                'atomo': 'El átomo es la pieza fundamental de la materia. Tiene un núcleo positivo en el centro y electrones orbitando alrededor.',
                'enlace': 'Un enlace es la unión entre átomos para conseguir estabilidad química.',
                'default': "¡Excelente duda de Química! Recuerda que puedes preguntarme sobre el 'atomo' o los 'enlaces' químicos por ahora."
            }
        };

        const asignaturaActiva = localStorage.getItem('asignaturaActiva') || 'mates';
        document.getElementById('titulo-asignatura').textContent = nombresAsignaturas[asignaturaActiva] || 'Tutor de IA';

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        function bienvenida() {
            agregarGlobo('✨ ¡Hola! Ya estamos en tu zona de estudio. Soy tu tutor personal de Bachillerato. Ahora puedes escribirme tus dudas matemáticas complejas o incluso pulsar el botón de la cámara 📸 para enviarme una foto de tu ejercicio. ¡Vamos a por ello!', 'bot');
        }

        function agregarGlobo(texto, emisor) {
            const globo = document.createElement('div');
            globo.classList.add('message', emisor);
            globo.textContent = texto;
            chatBox.appendChild(globo);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // LÓGICA DE FOTOS MULTIMEDIA
        function procesarFoto(event) {
            const archivo = event.target.files[0];
            if (!archivo) return;

            // Mostrar la imagen que subió el alumno en la caja de chat
            const reader = new FileReader();
            reader.onload = function(e) {
                const globoUsuario = document.createElement('div');
                globoUsuario.classList.add('message', 'user');
                globoUsuario.innerHTML = `📸 Has enviado una imagen:<br><img src="${e.target.result}" class="img-preview-chat">`;
                chatBox.appendChild(globoUsuario);
